backend:
  name: github
  repo: "" # e.g. "your-username/your-repo"
  branch: main

media_folder: "public/images"
# 公開URLのプレフィックス。CMSが本文に挿入する画像パス（例: /your-repo/images/x.png）に使う。
# base変更時は astro.config.mjs の base と必ず揃えること。
# 本文は表示ページの階層が可変なため絶対URLが必須で、favicon のような相対パス化・自動追従ができない。
public_folder: "/your-repo/images"

collections:
  - name: "works"
    label: "Works"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "URL", name: "url", widget: "string", required: false }
      # 公開日は暦日（時刻に意味が無い）。time_format: false で日付のみを保存する。
      # 既定の datetime widget はタイムゾーン無しの日時（2026-01-01T20:00:00）を書き、
      # それを YAML が UTC と解釈するため、入力した日付と表示が食い違う。
      - {
          label: "Publish Date",
          name: "pubDate",
          widget: "datetime",
          time_format: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
