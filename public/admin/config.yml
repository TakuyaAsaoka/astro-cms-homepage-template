backend:
  name: github
  repo: "" # e.g. "your-username/your-repo"
  branch: main

media_folder: "public/images"
# 公開URLのプレフィックス。CMSが本文に挿入する画像パス（例: /your-repo/images/x.png）に使う。
# base変更時は astro.config.mjs の base と必ず揃えること。
# 本文は表示ページの階層が可変なため絶対URLが必須で、favicon のような相対パス化・自動追従ができない。
public_folder: "/your-repo/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Site Settings"
        file: "src/content/settings/site.yaml"
        fields:
          - {
              label: "Site Title",
              name: "title",
              widget: "string",
              hint: "ヘッダー・ブラウザのタブ・SNS共有時に表示されます",
            }
          - {
              label: "Site Description",
              name: "description",
              widget: "string",
              hint: "検索結果やSNS共有時に表示される説明文",
            }
          - {
              label: "Author",
              name: "author",
              widget: "string",
              hint: "ホームのヒーローに大きく表示される名前",
            }
          - {
              label: "Copyright Holder",
              name: "copyrightHolder",
              widget: "string",
              hint: "フッターの © の後に表示される表記",
            }
          - {
              label: "Email",
              name: "email",
              widget: "string",
              required: false,
              pattern:
                [
                  '^([^@\s]+@[^@\s]+\.[^@\s]+)?$',
                  "正しいメールアドレスの形式で入力してください（空欄可）",
                ],
              hint: "ホームの連絡先に表示されます。空欄にすると表示されません",
            }
          - label: "Social Links"
            name: "social"
            widget: "object"
            hint: "空欄にしたリンクは表示されません"
            fields:
              - {
                  label: "GitHub",
                  name: "github",
                  widget: "string",
                  required: false,
                  pattern:
                    [
                      '^(https?://\S+)?$',
                      "https:// で始まる正しいURLを入力してください（空欄可）",
                    ],
                }
              - {
                  label: "X (Twitter)",
                  name: "twitter",
                  widget: "string",
                  required: false,
                  pattern:
                    [
                      '^(https?://\S+)?$',
                      "https:// で始まる正しいURLを入力してください（空欄可）",
                    ],
                }
              - {
                  label: "YouTube",
                  name: "youtube",
                  widget: "string",
                  required: false,
                  pattern:
                    [
                      '^(https?://\S+)?$',
                      "https:// で始まる正しいURLを入力してください（空欄可）",
                    ],
                }
          - {
              label: "note RSS URL",
              name: "noteRssUrl",
              widget: "string",
              required: false,
              pattern:
                [
                  '^(https?://\S+)?$',
                  "https:// で始まる正しいURLを入力してください（空欄可）",
                ],
              hint: "例: https://note.com/your-name/rss（空欄にするとBlogは案内表示になります）",
            }

  - name: "works"
    label: "Works"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Image", name: "image", widget: "image", required: false }
      # スキーマ（content.config.ts の z.url()）はビルド時に検証するが、
      # それではエラーの発見がデプロイまで遅れるため、CMS 側でも入力時に弾く
      - {
          label: "URL",
          name: "url",
          widget: "string",
          required: false,
          pattern:
            [
              '^(https?://\S+)?$',
              "https:// または http:// で始まる正しいURLを入力してください（空欄可）",
            ],
        }
      # 公開日は暦日で、スキーマも日付だけを保持する（content.config.ts）。
      # 既定の datetime widget は時刻まで書き込むため、time_format: false で揃える。
      - {
          label: "Publish Date",
          name: "pubDate",
          widget: "datetime",
          time_format: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
