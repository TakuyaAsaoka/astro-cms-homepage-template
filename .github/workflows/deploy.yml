name: Deploy to GitHub Pages

on:
  # テンプレートでは自動デプロイを無効化。
  # テンプレートから新規作成後、以下のコメントを解除してください。
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Google Fonts のダウンロードキャッシュ。API の一時障害でのビルド失敗を防ぐ。
      # キャッシュ先は astro.config.mjs の cacheDir（node_modules 外に出してあるため
      # withastro/action 内部の npm ci に消されない）
      - name: Cache Astro fonts
        uses: actions/cache@v4
        with:
          path: .astro-cache/fonts
          key: astro-fonts-${{ hashFiles('astro.config.mjs') }}
          restore-keys: astro-fonts-
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
