lead: ここに自己紹介のリード文を書きます。あなたの職種や活動を一文で紹介しましょう。
sections:
  - title: 経歴
    label: CAREER
    body: ここにこれまでの歩みを書きます。どのような経緯で今の活動に至ったかを綴りましょう。
  - title: 強み
    label: STRENGTHS
    body: ここに得意なことや提供できる価値を書きます。あなたならではの強みを言葉にしましょう。
  - title: 価値観
    label: VALUES
    body: ここに大事にしている考え方を書きます。仕事や活動で大切にしていることを綴りましょう。
